# ===== VexoraSounds =====
# Semua nilai "key" boleh sound bawaan Minecraft (mis. entity.player.levelup)
# atau sound dari resource packmu sendiri (mis. vexora:hit).

resource-pack:
  enabled: true
  # Link langsung ke file .zip (harus bisa diunduh langsung, bukan halaman web)
  url: ""
  # SHA-1 file zip (40 karakter hex). Sangat disarankan diisi; kalau pack diganti, isi ulang.
  sha1: ""
  # true = pemain yang menolak / gagal download otomatis terputus oleh client
  required: true
  # Batas waktu tunggu download di layar loading (detik)
  timeout-seconds: 120
  prompt: "&bVexora memakai resource pack untuk efek suara. Terima untuk lanjut bermain."

sounds:
  hit:
    enabled: true
    key: "entity.player.attack.strong"
    volume: 1.0
    pitch: 1.2
  kill:
    enabled: true
    key: "entity.experience_orb.pickup"
    volume: 1.0
    pitch: 0.8
  hotbar:
    enabled: false
    key: "ui.button.click"
    volume: 0.3
    pitch: 1.6
  craft:
    enabled: true
    key: "block.anvil.use"
    volume: 0.6
    pitch: 1.4
  offhand:
    enabled: true
    key: "item.armor.equip_chain"
    volume: 0.7
    pitch: 1.2

# Suara tambahan sesuai jumlah kill beruntun (tanpa mati).
# Dipakai angka tertinggi yang <= streak pemain.
killstreak:
  enabled: true
  tiers:
    "2":
      key: "entity.player.levelup"
      volume: 1.0
      pitch: 1.0
    "3":
      key: "entity.player.levelup"
      volume: 1.0
      pitch: 1.3
    "5":
      key: "ui.toast.challenge_complete"
      volume: 1.0
      pitch: 1.0
    "10":
      key: "entity.ender_dragon.growl"
      volume: 0.8
      pitch: 1.2

messages:
  prefix: "&8[&bVexora&8]&r "
  reloaded: "&aConfig dimuat ulang."
  no-permission: "&cKamu tidak punya izin."
  sound-on: "&aEfek suara dinyalakan."
  sound-off: "&cEfek suara dimatikan."
